# Temporary IP-only deployment. The API and database stay on the Compose network.
# Use with: docker compose -f docker-compose.yml -f infrastructure/compose/ec2-http.yml up --build -d
# HTTPS and seeded role workflows require a domain and an approved data source.
services:
  postgres:
    ports: !override []

  intelligence:
    ports: !override []

  api:
    ports: !override []
    volumes: !override []
    environment:
      WEB_ORIGINS: http://${PUBLIC_HOST:?Set PUBLIC_HOST to the EC2 public IP}
      COOKIE_SECURE: "false"
      REFERENCE_SEED_ON_STARTUP: "false"
      DEMO_SEED_ON_STARTUP: "false"
      FORECAST_SEED_ON_STARTUP: "false"
      SEED_ACCOUNTS_ENABLED: "false"
      DEMO_CLOCK_INSTANT: ""

  web:
    ports: !override
      - "80:80"
    build:
      args:
        VITE_API_BASE_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST to the EC2 public IP}
        VITE_SEED_DISPATCHER_PASSWORD: ""
        VITE_SEED_STORE_MANAGER_PASSWORD: ""
        VITE_SEED_LOADER_PASSWORD: ""
        VITE_SEED_DRIVER_PASSWORD: ""
    volumes:
      - ./infrastructure/compose/ec2-http.nginx.conf:/etc/nginx/conf.d/default.conf:ro
